<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAMR | ماشین‌حساب مهندسی برق</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8eff2;--cd:#fff;--tx:#0a2230;--mu:#587080;--ac:#0b6e7f;--ln:#d2dee3;--chip:#eaf1f4;--ok:#0a8f5b;--wr:#b45309;--er:#c62828;--ink:#072431;--amb:#f2a71b;--sh:0 1px 0 rgba(7,36,49,.04),0 10px 22px -18px rgba(7,36,49,.5);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06161e;--cd:#0d2430;--tx:#e6f1f4;--mu:#8ea8b3;--ac:#4fc3d6;--ln:#1c3a48;--chip:#13313f;--ok:#35c98d;--wr:#f0a840;--er:#ff7a7a;--sh:0 1px 0 rgba(0,0,0,.3),0 10px 22px -18px rgba(0,0,0,.9);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#06161e;--cd:#0d2430;--tx:#e6f1f4;--mu:#8ea8b3;--ac:#4fc3d6;--ln:#1c3a48;--chip:#13313f;--ok:#35c98d;--wr:#f0a840;--er:#ff7a7a;--sh:0 1px 0 rgba(0,0,0,.3),0 10px 22px -18px rgba(0,0,0,.9);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.7 Vazirmatn,Tahoma,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:2px solid var(--amb)}
header .lg{display:flex}header b{font-size:18px;letter-spacing:2px}header small{opacity:.7;flex:1;font-size:12px}
header button{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:11px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
main{max-width:760px;margin:auto;padding:14px 14px 40px}
h2{font-size:15px;margin:22px 0 10px;display:flex;align-items:center;gap:8px;color:var(--tx);font-weight:800}
h2::before{content:"";width:18px;height:4px;border-radius:2px;background:var(--amb)}
input,select,textarea{width:100%;min-height:46px;border:1px solid var(--ln);border-radius:12px;background:var(--cd);color:var(--tx);padding:0 12px;font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
input[dir=ltr]{text-align:left}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.t{display:block;width:100%;text-align:right;cursor:pointer;color:inherit;font:inherit}
.t small{color:var(--mu);display:block}
.badge{font-size:11px;padding:1px 9px;border-radius:99px;background:var(--wr);color:#fff;white-space:nowrap}
.hero{position:relative;overflow:hidden;border-radius:20px;padding:18px 16px 16px;color:#fff;background:linear-gradient(140deg,#072431 0%,#0a3a4a 58%,#0d5062 100%);margin-bottom:12px}
.hero .pcb{position:absolute;inset:0;width:100%;height:100%;opacity:.2;pointer-events:none}
.hero .hc{position:relative}.hero h1{margin:0;font-size:23px;line-height:1.45;font-weight:800}.hero p{margin:4px 0 14px;opacity:.82;font-size:13.5px}
.sb{position:relative}.sb svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:#587080;pointer-events:none}
.sb input{padding-inline-start:44px;min-height:50px;border:0;border-radius:14px;background:#fff;color:#0a2230}
.chips{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}.chips span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:0 11px;font-size:12.5px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 2px}
.qc{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:10px;background:var(--cd);box-shadow:var(--sh)}
.qc .ti{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.qc b{display:block;font-size:13.5px;line-height:1.45}.qc small{display:block;color:var(--mu);font-size:12px;line-height:1.45}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{padding:0;border:1px solid var(--ln);border-radius:16px;background:var(--cd);overflow:hidden;cursor:pointer;text-align:right;color:var(--tx);font:inherit;display:block;box-shadow:var(--sh)}
.tile .im{display:block;background:color-mix(in srgb,var(--c) 13%,var(--cd));color:var(--c);padding:10px 10px 6px}.tile .im svg{width:100%;height:auto;max-height:88px;display:block}
.tile .tl{display:block;padding:8px 12px 10px}.tile b{display:block;font-size:13.5px;line-height:1.5}.tile small{color:var(--mu);font-size:12px}
.tile.on{outline:2px solid var(--c);outline-offset:1px}
.tc{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--cd);border:1px solid var(--ln);border-inline-start:4px solid var(--c);border-radius:12px;padding:9px 12px;margin-bottom:8px;color:var(--tx);font:inherit;cursor:pointer;box-shadow:var(--sh)}
.tc .ti{flex:none;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.tc .tx{flex:1;min-width:0}.tc b{display:block;font-size:14.5px;line-height:1.5}.tc small{display:block;color:var(--mu);font-size:12.5px;line-height:1.5}
.pj{display:flex;gap:6px;margin-bottom:8px}.pj .tc{margin:0;flex:1}.del{flex:none;width:46px;border-radius:12px;border:1px solid var(--er);background:var(--cd);color:var(--er);font-size:22px;cursor:pointer}
.bn{display:flex;align-items:center;gap:10px;overflow:hidden;padding:14px 16px;border-radius:18px;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 82%,#072431),#072431);margin:6px 0 12px}
.bn .bt{flex:1;min-width:0}.bn small{opacity:.85;font-size:12.5px;display:block}.bn h1{margin:0;font-size:18px;line-height:1.55}
.bn .ba{flex:none;width:112px;color:rgba(255,255,255,.92)}.bn .ba svg{width:100%;height:auto;display:block}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cats button{min-height:46px;border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:12px;font:inherit;padding:6px;cursor:pointer}
.cats button.on{border-color:var(--ac);outline:2px solid var(--ac);background:color-mix(in srgb,var(--ac) 10%,var(--cd))}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.fld{min-width:0}.fld.w2{grid-column:1/-1}
.row{display:flex;gap:8px;margin:12px 0}.row button{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--ln);font:700 15px Vazirmatn,Tahoma,sans-serif;background:var(--cd);color:var(--tx);cursor:pointer}
.row .p{background:var(--amb);color:#072431;border-color:transparent;font-weight:800}
.row input{margin:0}
label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mu)}label i{font-style:normal}
.un{display:inline-block;direction:ltr;margin-inline-start:4px;padding:0 7px;border-radius:6px;background:var(--chip);color:var(--tx);font-size:11.5px;line-height:1.6}
.res div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px solid var(--ln)}.res div:last-child{border:0}
.res b{font-weight:500;font-size:13.5px;color:var(--mu)}.res span{direction:ltr;font-size:17px;font-weight:700;color:var(--tx);text-align:left}
.er{border-color:var(--er);color:var(--er)}.w{color:var(--wr)}.ok{color:var(--ok)}
code{direction:ltr;display:block;text-align:left;white-space:pre-wrap;font-size:13.5px;color:var(--tx);background:var(--chip);border-radius:8px;padding:4px 8px;margin:4px 0}
a.back{color:var(--ac);text-decoration:none;display:inline-block;min-height:36px;font-size:14px}
@media print{:root,:root[data-theme]{--bg:#fff;--cd:#fff;--tx:#000;--mu:#333;--ac:#0b3d91;--ln:#999;--ok:#060;--wr:#840;--er:#a00;--sh:none;color-scheme:light}header,body::before,.row,a.back,.bn .ba{display:none!important}body{background:#fff}.bn{color:#000;background:#fff!important;border:1px solid #999}}
.tbar{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin:8px -2px 0;scrollbar-width:none}.tbar::-webkit-scrollbar{display:none}
.tbar button{flex:none;min-width:76px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1px solid var(--ln);border-radius:14px;background:var(--cd);color:var(--tx);font:600 12px Vazirmatn,Tahoma,sans-serif;cursor:pointer;box-shadow:var(--sh)}
.tbar svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tbar button.on{background:var(--ink);border-color:var(--ink);color:var(--amb)}
.hp{margin-top:12px;border:1px solid var(--ln);border-radius:14px;padding:0 12px;background:var(--chip)}.hp summary{min-height:46px;display:flex;align-items:center;font-weight:700;font-size:14px;cursor:pointer}.hp[open]{padding-bottom:12px}.hp p{margin:0;color:var(--mu);font-size:13px;line-height:1.9}
.stp{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-weight:800;font-size:15px}.stp i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--amb);display:grid;place-items:center;font-style:normal;font-size:13px}

#samr-menu-toggle{position:fixed;left:12px;top:14px;z-index:10020;width:44px;height:44px;border:1px solid var(--ln);border-radius:12px;background:var(--cd);color:var(--tx);font-size:25px;box-shadow:0 3px 12px #0002;cursor:pointer}
#samr-drawer-shade{position:fixed;inset:0;background:#0007;z-index:10010;display:none}
#samr-drawer{position:fixed;left:0;top:0;bottom:0;width:min(290px,82vw);z-index:10011;background:var(--bg);border-right:1px solid var(--ln);box-shadow:6px 0 25px #0003;transform:translateX(-105%);transition:transform .22s ease;padding:20px 14px;box-sizing:border-box;overflow:auto}
#samr-drawer.open{transform:translateX(0)}
#samr-drawer h3{margin:48px 0 18px}
#samr-drawer a{display:flex;align-items:center;gap:10px;padding:13px 12px;margin:7px 0;border:1px solid var(--ln);border-radius:12px;background:var(--cd);color:var(--tx);text-decoration:none;font-weight:700}
#samr-drawer a:active{opacity:.75}
</style></head><body>
<header><span class="lg" id="lg0"></span><b>SAMR</b><small>ماشین‌حساب مهندسی برق</small><button id="th" aria-label="تغییر تم"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button></header>
<main id="app"></main>
<script>
// ===== موتور محاسبات (مستقل از UI) =====
const N=x=>isFinite(x)?String(+x.toPrecision(6)):'—';
const req=(x,l,o={})=>{if(x===null||x===undefined||isNaN(x))throw Error('مقدار «'+l+'» را وارد کنید');
 if(o.gt!==undefined&&!(x>o.gt))throw Error('«'+l+'» باید بزرگ‌تر از '+o.gt+' باشد');
 if(o.ge!==undefined&&x<o.ge)throw Error('«'+l+'» نباید کمتر از '+o.ge+' باشد');
 if(o.le!==undefined&&x>o.le)throw Error('«'+l+'» نباید بیشتر از '+o.le+' باشد');return x};
const R=(formula,subs,steps,res,warn=[],check='',ref='')=>({formula,subs,steps,res,warn,check,ref});
const z=()=>{throw Error('مقدار صفر مجاز نیست؛ نتیجه تعریف‌نشده است')};
const D=Math.PI/180;
const CATS={ckt:'مدارهای الکتریکی',mac:'ماشین‌های الکتریکی',ind:'برق صنعتی',bld:'برق ساختمان',sol:'خورشیدی و ذخیره‌سازی',pwr:'سیستم‌های قدرت',ele:'الکترونیک قدرت',mth:'ریاضیات مهندسی',ins:'ابزار دقیق',plc:'PLC و میکروکنترلر',prt:'حفاظت و استانداردها'};
// فیلدها: [کلید, برچسب, واحد, پیش‌فرض, 't' برای متن | آرایه گزینه‌ها]
const T=[
{id:'ohm',cat:'ckt',pop:1,name:'قانون اهم و توان',desc:'هر دو کمیت از V, I, R, P را بدهید',
 f:[['V','ولتاژ','V',''],['I','جریان','A',''],['R','مقاومت','Ω',''],['P','توان','W','']],
 run(v){const g=['V','I','R','P'].filter(k=>v[k]!==null&&!isNaN(v[k]));
  if(g.length<2)throw Error('حداقل دو کمیت را وارد کنید');
  let {V,I,R:r,P}=v;const a=g.slice(0,2).join('+'),w=[];
  if(g.length>2)w.push('بیش از دو کمیت وارد شد؛ فقط '+g.slice(0,2).join(' و ')+' استفاده شد.');
  if(a.includes('R'))req(r,'R',{gt:0});if(a.includes('P'))req(P,'P',{ge:0});
  if(a==='V+I'){}else if(a==='V+R')I=V/r;else if(a==='V+P'){if(!V)z();I=P/V}else if(a==='I+R')V=I*r;else if(a==='I+P'){if(!I)z();V=P/I}else{I=Math.sqrt(P/r);V=I*r}
  if(!I)z();r=V/I;P=V*I;
  return R('V = I·R ، P = V·I = I²·R = V²/R','V='+N(V)+' V ، I='+N(I)+' A',['R = V/I = '+N(V)+'/'+N(I)+' = '+N(r)+' Ω','P = V·I = '+N(P)+' W'],
   [['ولتاژ',N(V),'V'],['جریان',N(I),'A'],['مقاومت',N(r),'Ω'],['توان',N(P),'W']],w,'I²R = '+N(I*I*r)+' W و V²/R = '+N(V*V/r)+' W باید با P برابر باشند.')}},
{id:'sp',cat:'ckt',pop:1,name:'مقاومت سری و موازی',desc:'مقاومت معادل و جریان‌ها',
 f:[['L','مقاومت‌ها (با کاما جدا کنید)','Ω','100, 220, 470','t'],['V','ولتاژ منبع (اختیاری)','V','']],
 run(v){const L=String(v.L).split(/[,،\s]+/).filter(Boolean).map(Number);
  if(L.length<2||L.some(x=>isNaN(x)||x<0))throw Error('حداقل دو مقاومت معتبر و غیرمنفی وارد کنید');
  const rs=L.reduce((a,b)=>a+b,0),rp=L.includes(0)?0:1/L.reduce((a,b)=>a+1/b,0),res=[['سری',N(rs),'Ω'],['موازی',N(rp),'Ω']],w=[];
  if(v.V!==null&&!isNaN(v.V)){res.push(['جریان کل (سری)',N(v.V/rs),'A']);if(rp)res.push(['جریان کل (موازی)',N(v.V/rp),'A']);else w.push('مقاومت صفر در حالت موازی اتصال کوتاه است.')}
  return R('Rs = ΣRi ، 1/Rp = Σ(1/Ri)','R = ['+L.join(', ')+'] Ω',['Rs = '+L.join(' + ')+' = '+N(rs),'Rp = 1/('+L.map(x=>'1/'+x).join(' + ')+') = '+N(rp)],res,w,'Rp باید از کوچک‌ترین مقاومت کمتر باشد: '+N(rp)+' ≤ '+N(Math.min(...L)))}},
{id:'p3',cat:'pwr',pop:1,name:'توان سه‌فاز',desc:'S, P, Q از ولتاژ خط و جریان',
 f:[['V','ولتاژ خط','V','400'],['I','جریان خط','A',''],['pf','ضریب توان','','0.85'],['k','نوع بار','',[['i','سلفی (پس‌فاز)'],['c','خازنی (پیش‌فاز)']]]],
 run(v){req(v.V,'ولتاژ',{gt:0});req(v.I,'جریان',{gt:0});req(v.pf,'ضریب توان',{gt:0,le:1});
  const S=Math.sqrt(3)*v.V*v.I,P=S*v.pf,ph=Math.acos(v.pf),Q=S*Math.sin(ph)*(v.k==='c'?-1:1);
  return R('S = √3·V·I ، P = S·cosφ ، Q = S·sinφ','V='+v.V+' ، I='+v.I+' ، cosφ='+v.pf,['S = 1.732×'+v.V+'×'+v.I+' = '+N(S/1000)+' kVA','P = '+N(P/1000)+' kW','φ = '+N(ph/D)+'°'],
   [['توان ظاهری',N(S/1000),'kVA'],['توان اکتیو',N(P/1000),'kW'],['توان راکتیو',N(Q/1000),'kvar'],['زاویه φ',N(ph/D),'°']],
   ['فرض: بار متعادل.'],'S² = P² + Q²: '+N((S*S)/1e6)+' ≈ '+N((P*P+Q*Q)/1e6))}},
{id:'pfc',cat:'ind',pop:1,name:'اصلاح ضریب توان (خازن)',desc:'ظرفیت بانک خازنی موردنیاز',
 f:[['P','توان اکتیو','kW',''],['V','ولتاژ (خط یا فاز تک‌فاز)','V','400'],['f','فرکانس','Hz','50'],['p1','ضریب توان فعلی','','0.75'],['p2','ضریب توان هدف','','0.95'],['c','اتصال','',[['d','سه‌فاز مثلث'],['y','سه‌فاز ستاره'],['s','تک‌فاز']]]],
 run(v){req(v.P,'توان',{gt:0});req(v.V,'ولتاژ',{gt:0});req(v.f,'فرکانس',{gt:0});req(v.p1,'ضریب توان فعلی',{gt:0,le:1});req(v.p2,'ضریب توان هدف',{gt:0,le:1});
  if(v.p2<=v.p1)throw Error('ضریب توان هدف باید بیشتر از ضریب توان فعلی باشد');
  const t=x=>Math.tan(Math.acos(x)),Q=v.P*(t(v.p1)-t(v.p2)),w=2*Math.PI*v.f,C=Q*1000/(w*v.V*v.V)/(v.c==='d'?3:1)*1e6;
  return R('Qc = P·(tanφ1 − tanφ2) ، C = Qc / (ω·V²) [مثلث: تقسیم بر ۳]','P='+v.P+' kW ، '+v.p1+' → '+v.p2,['Qc = '+v.P+'×('+N(t(v.p1))+' − '+N(t(v.p2))+') = '+N(Q)+' kvar','ω = 2π×'+v.f+' = '+N(w)],
   [['توان راکتیو خازن',N(Q),'kvar'],['ظرفیت هر خازن/فاز',N(C),'µF']],['در اتصال ستاره V را ولتاژ خط وارد کنید؛ هارمونیک و رزونانس بررسی نشده است.'],'cosφ هدف: '+v.p2,'')}},
{id:'ind',cat:'mac',pop:1,name:'موتور القایی: سرعت و لغزش',desc:'سرعت سنکرون، لغزش، فرکانس روتور',
 f:[['f','فرکانس شبکه','Hz','50'],['p','تعداد قطب','','4'],['n','سرعت روتور','rpm','1440']],
 run(v){req(v.f,'فرکانس',{gt:0});req(v.p,'قطب',{gt:0});req(v.n,'سرعت روتور',{ge:0});
  if(v.p%2)throw Error('تعداد قطب باید زوج باشد');
  const ns=120*v.f/v.p,s=(ns-v.n)/ns,w=[];
  if(s<0)w.push('لغزش منفی: ناحیه ژنراتوری.');if(s>0.1)w.push('لغزش بیش از ۱۰٪ است؛ مقدار ورودی را بررسی کنید.');
  return R('ns = 120f/p ، s = (ns − n)/ns ، fr = s·f','f='+v.f+' ، p='+v.p+' ، n='+v.n,['ns = 120×'+v.f+'/'+v.p+' = '+N(ns)+' rpm','s = ('+N(ns)+' − '+v.n+')/'+N(ns)],

 const cv=$('#cv'),c=cv.getContext('2d'),K=p=>p[0]+','+p[1];

  ['syn',{I:50,Xs:3,Ra:.2},0,()=>Math.hypot(400/S3+.2*40+3*30,3*40-.2*30),1e-5,'نیروی محرکه ژنراتور سنکرون'],['bat',{P:500,h:5},1,()=>500*5/(.8*.9)/48,1e-6,'ظرفیت باتری'],['mbs',{},1,()=>(40*11/9600+.005)*1000,1e-6,'زمان تراکنش Modbus']];
 const base=(t,ov)=>{const v={};t.f.forEach(([k,l,u,d,o])=>{v[k]=Array.isArray(o)?d:(o==='t'||o==='ta')?String(d):d===''?null:Number(d)});return Object.assign(v,ov)};let ok=0;
 const rows=C.map(([id,ov,ri,ef,tol,lb])=>{try{const t=T.find(x=>x.id===id),r=t.run(base(t,ov)),got=parseFloat(r.res[ri][1]),exp=typeof ef==='function'?ef():parseFloat(r.res[+ef][1]),pass=Math.abs(got-exp)<=tol*Math.max(Math.abs(exp),1e-12);if(pass)ok++;return{lb,got,exp,pass}}catch(e){return{lb,err:e.message}}});

<script>(()=>{const K='samr_profile_v1',RK='samr_reports_v1',SK='samr_session_v1',get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},put=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),f=(l,id,t='text',v='')=>`<label>${l}</label><input id="${id}" type="${t}" value="${esc(v)}">`;
